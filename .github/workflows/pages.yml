# Probna verzija sajta na GitHub Pages (https://martin9max.github.io/beep-beep-dostava/).
# Pravi se sama posle svakog push-a na main. Bez servera: registracija, prijava i
# porudžbine rade tek na pravom sajtu (Railway), ovde se samo vidi izgled.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /beep-beep-dostava/
          VITE_STATIC_DEMO: '1'
      # stranice kao /naruci nemaju svoj fajl: GitHub tada šalje 404.html, a to je isti sajt
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
